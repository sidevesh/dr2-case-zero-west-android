plugins {
    id 'com.android.application'
}

// The native side is built outside Gradle (scripts/build-native-android.sh): it needs
// the player's own recompiled game, which Gradle has no business producing. This file
// only packages what that script staged under $dr2.work/out/<game>/.
def work = rootProject.file(project.property('dr2.work').toString())
def sdlJava = new File(work, 'deps/sdl2/java')
def outFor = { String game -> new File(work, "out/${game}") }
def stubFor = { String game ->
    def f = new File(outFor(game), 'jniLibs/.stub')
    f.exists() ? f.text.trim() == '1' : true
}

android {
    namespace 'io.github.sidevesh.dr2'
    compileSdk 35

    defaultConfig {
        // API 33: the first Android whose libvulkan.so exports the Vulkan 1.3 core the
        // renderer calls (scripts/common.sh explains).
        minSdk 33
        targetSdk 35
        versionCode 112
        versionName '1.1.2'
        ndk { abiFilters 'arm64-v8a' }
    }

    flavorDimensions = ['game']
    productFlavors {
        casezero {
            dimension 'game'
            applicationId 'io.github.sidevesh.dr2.casezero'
            resValue 'string', 'app_name', 'Dead Rising 2: Case Zero'
            buildConfigField 'String', 'GAME_ID', '"casezero"'
            buildConfigField 'String', 'GAME_TITLE', '"Dead Rising 2: Case Zero"'
            buildConfigField 'String', 'ENV_PREFIX', '"CZ"'
            buildConfigField 'String', 'RUNTIME_LOG', '"cz_runtime.log"'
            buildConfigField 'String', 'TITLE_ID', '"58410A8D"'
            buildConfigField 'String', 'PACKAGE_SIZE', '"about 825 MB"'
            buildConfigField 'boolean', 'NATIVE_STUB', "${stubFor('casezero')}"
            // Where the runtime keeps its settings file (host_paths.cpp SavedGames + main.cpp).
            buildConfigField 'String', 'SAVE_FOLDER', '"Dead Rising 2 Case Zero"'
            buildConfigField 'String', 'SETTINGS_FILE', '"cz_settings.txt"'
        }
        casewest {
            dimension 'game'
            applicationId 'io.github.sidevesh.dr2.casewest'
            resValue 'string', 'app_name', 'Dead Rising 2: Case West'
            buildConfigField 'String', 'GAME_ID', '"casewest"'
            buildConfigField 'String', 'GAME_TITLE', '"Dead Rising 2: Case West"'
            buildConfigField 'String', 'ENV_PREFIX', '"CW"'
            buildConfigField 'String', 'RUNTIME_LOG', '"cw_runtime.log"'
            buildConfigField 'String', 'TITLE_ID', '"58410B00"'
            buildConfigField 'String', 'PACKAGE_SIZE', '"about 1.2 GB"'
            buildConfigField 'boolean', 'NATIVE_STUB', "${stubFor('casewest')}"
            // Where the runtime keeps its settings file (host_paths.cpp SavedGames + main.cpp).
            buildConfigField 'String', 'SAVE_FOLDER', '"Dead Rising 2 Case West"'
            buildConfigField 'String', 'SETTINGS_FILE', '"cw_settings.txt"'
        }
    }

    sourceSets {
        // SDL's Java half, from the exact SDL tree the native libSDL2.so was built from.
        main.java.srcDirs += sdlJava
        casezero {
            jniLibs.srcDirs = [new File(outFor('casezero'), 'jniLibs')]
            assets.srcDirs = [new File(outFor('casezero'), 'apk-assets')]
            // The launcher icon made from the player's own box art (scripts/make-icons.py),
            // when build-apk.sh could make one; src/casezero/res holds the fallback.
            res.srcDirs += new File(outFor('casezero'), 'res-icon')
        }
        casewest {
            jniLibs.srcDirs = [new File(outFor('casewest'), 'jniLibs')]
            assets.srcDirs = [new File(outFor('casewest'), 'apk-assets')]
            // The launcher icon made from the player's own box art (scripts/make-icons.py),
            // when build-apk.sh could make one; src/casewest/res holds the fallback.
            res.srcDirs += new File(outFor('casewest'), 'res-icon')
        }
    }

    signingConfigs {
        // A release key from the environment if one is given; otherwise this machine's
        // debug key. An APK signed with another key cannot update an installed one.
        release {
            def ks = System.getenv('DR2_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('DR2_KEYSTORE_PASSWORD')
                keyAlias System.getenv('DR2_KEY_ALIAS')
                keyPassword System.getenv('DR2_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('DR2_KEYSTORE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
        resValues true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources {
        // A --bundle build carries ~0.9 GB of game data whose archives are compressed
        // already: store every entry as-is, so the build does not spend minutes
        // deflating it and the app streams it straight out of the APK on first run.
        if (project.findProperty('dr2.bundled')?.toString() == '1') noCompress ''
        // AAPT's default pattern drops every dot-file and "_"-prefixed folder from
        // assets — and the runtime's overlay stamps are dot-files
        // (game_patched/.cz_overlay_version). Keep everything but VCS/OS litter.
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
    packaging {
        // Extracted to nativeLibraryDir on install: libadrenotools, which loads the
        // bundled Turnip driver, needs its hook libraries there as real files (see its
        // driver.h), and the manifest's extractNativeLibs follows this.
        jniLibs.useLegacyPackaging = true
    }
    lint {
        // SDL's own Java is not ours to lint.
        checkReleaseBuilds false
        abortOnError false
    }
}

// Fail early, with the fix, if the native side has not been built for a flavor.
tasks.configureEach { t ->
    def m = (t.name =~ /^merge(Casezero|Casewest)(Debug|Release)JniLibFolders$/)
    if (m.matches()) {
        def game = m.group(1).toLowerCase()
        t.doFirst {
            if (!new File(outFor(game), "jniLibs/arm64-v8a/libmain.so").exists())
                throw new GradleException("No native build for ${game}: run " +
                    "scripts/build-native-android.sh ${game} (see README)")
            if (!sdlJava.exists())
                throw new GradleException("No SDL Java sources at ${sdlJava}: run build-deps-android.sh")
        }
    }
}
