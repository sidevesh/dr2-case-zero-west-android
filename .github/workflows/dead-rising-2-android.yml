# Dead Rising 2 (Case Zero, Case West) for Android — CI, honestly scoped.
#
# A GREEN TICK HERE DOES NOT MEAN "THE GAME RUNS ON ANDROID".
#
# No runner has the game, and none may, so the real recompiled image cannot exist
# here. What this proves, per game, is exactly:
#   * the pinned upstream port + recompilers fetch, and this repo's patches apply;
#   * SDL2, ffmpeg (LGPL, XMA only) and XenonUtils cross-compile for Android arm64;
#   * the patched runtime compiles and links as libmain.so against a STUB image
#     (upstream's tools/gen_stub_ppc.py), with every library loadable on Android 13+;
#   * the APK packages (16 KB-aligned native libraries) — marked STUB-NOT-PLAYABLE;
#   * the PC-side prep tool (host runtime, for the shader cache) builds and passes
#     upstream's own --smoke.
name: dead-rising-2-android

on:
  push:
    paths:
      - 'dead-rising-2/**'
      - '.github/workflows/dead-rising-2-android.yml'
  pull_request:
    paths:
      - 'dead-rising-2/**'
      - '.github/workflows/dead-rising-2-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        game: [casezero, casewest]
    env:
      DR2_WORK: ${{ github.workspace }}/dr2-work
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang cmake python3 pkg-config \
            libvulkan-dev libavcodec-dev libavutil-dev

      - name: Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" "platforms;android-35"

      - name: download cache
        uses: actions/cache@v4
        with:
          path: dr2-work/downloads
          key: dr2-downloads-${{ hashFiles('dead-rising-2/scripts/common.sh') }}

      - name: fetch sources (pinned) and apply patches
        run: dead-rising-2/scripts/fetch-sources.sh ${{ matrix.game }}

      - name: Android dependencies (SDL2, ffmpeg, XenonUtils)
        run: dead-rising-2/scripts/build-deps-android.sh

      - name: Turnip (Mesa) and libadrenotools for Android
        run: |
          sudo apt-get install -y glslang-tools bison flex python3-venv
          dead-rising-2/scripts/build-turnip.sh

      - name: host prep tools (XenonRecomp, DXC, prep runtime)
        run: dead-rising-2/scripts/build-host-tools.sh ${{ matrix.game }}

      - name: native runtime for Android (STUB image)
        run: dead-rising-2/scripts/build-native-android.sh ${{ matrix.game }} --stub

      - name: APK
        run: dead-rising-2/scripts/build-apk.sh ${{ matrix.game }} release

      - name: logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.game }}
          if-no-files-found: ignore
          path: |
            dr2-work/*.log
            dr2-work/host/*.log

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.game }}-STUB-NOT-PLAYABLE-apk
          path: dr2-work/out/${{ matrix.game }}/DR2-*.apk*
